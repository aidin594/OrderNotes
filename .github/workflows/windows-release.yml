name: Build and publish Windows EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'tests/test_storage.py'
      - 'app.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ordernotes-v1.8.3-windows-release-headless
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run all unit tests
        run: python -m unittest discover -s tests -v

      - name: Check GUI smoke test syntax
        run: python -m py_compile tests/gui_smoke.py
        # Interactive Tk tests run locally; hosted Windows Actions has no usable desktop.

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7"

      - name: Build portable folder and standalone EXE
        shell: pwsh
        run: |
          $icon = (Resolve-Path 'assets/order_notes.ico').Path
          $png = (Resolve-Path 'assets/order_notes.png').Path
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name OrderNotes --icon "$icon" --add-data "$icon;assets" --add-data "$png;assets" --distpath "build/output" --workpath "build/work" --specpath "build" app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OrderNotes --icon "$icon" --add-data "$icon;assets" --add-data "$png;assets" --distpath "build/standalone" --workpath "build/onefile-work" --specpath "build/onefile-spec" app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force 'release/OrderNotes_Portable' | Out-Null
          Copy-Item 'build/output/OrderNotes/*' 'release/OrderNotes_Portable/' -Recurse -Force
          Compress-Archive -Path 'release/OrderNotes_Portable' -DestinationPath 'release/OrderNotes_v1.8.3_Windows_Portable.zip' -Force
          Copy-Item 'build/standalone/OrderNotes.exe' 'release/OrderNotes_v1.8.3_Standalone.exe' -Force
          if (!(Test-Path 'release/OrderNotes_v1.8.3_Windows_Portable.zip') -or !(Test-Path 'release/OrderNotes_v1.8.3_Standalone.exe')) { throw 'Missing build output' }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.8.3'
          $zip = 'release/OrderNotes_v1.8.3_Windows_Portable.zip'
          $exe = 'release/OrderNotes_v1.8.3_Standalone.exe'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe --target $env:GITHUB_SHA --title 'Order Notes v1.8.3' --notes 'Ready-to-run Windows builds. The standalone EXE stores data in a data folder beside the EXE. The portable ZIP includes OrderNotes.exe and its _internal dependencies. No customer database, credentials or personal configuration is included. Back up your existing data folder before upgrading.' --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
